[project]
name = "athena-assistant"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
description = "A local-first personal assistant with a durable runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "jsonschema>=4.25,<5",
  "openpyxl>=3.1.5,<4",
  "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/athena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.uv]
required-version = ">=0.9"

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true
