name: athena
services:
  gateway:
    image: athena-preview:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ATHENA_PROCESS: gateway
      ATHENA_GATEWAY_DATA_DIR: /data
      ATHENA_GATEWAY_KEY_FILE: /run/secrets/model-key
    volumes:
      - /opt/athena/data/accounts:/data
      - /opt/athena/secrets/model-key:/run/secrets/model-key:ro
    ports: ["127.0.0.1:4322:4321"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
  web:
    image: athena-preview:local
    environment:
      ATHENA_PROCESS: web
      ATHENA_DEPLOYMENT: hosted
      ATHENA_DATA_DIR: /data
      ATHENA_PUBLIC_ORIGIN: https://chat.athena.featherhk.com
      ATHENA_CLOUD_URL: https://chat.athena.featherhk.com/v1
    volumes:
      - /opt/athena/data/web:/data
    ports: ["127.0.0.1:4317:4317"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1024m
    restart: unless-stopped
  edge:
    image: caddy:2.10.2-alpine
    ports: ["443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/athena/data/tls:/data
      - /opt/athena/data/caddy:/config
      - /opt/athena/downloads:/srv/downloads:ro
      - /opt/athena/site:/srv/site:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
